[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# NGINX Web Server
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

# Backend API Server
[program:backend]
command=npm start
directory=/app/app/backend
autostart=true
autorestart=true
user=node
environment=NODE_ENV=production
stdout_logfile=/var/log/backend/stdout.log
stderr_logfile=/var/log/backend/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

# Worker Service
[program:worker]
command=npm start
directory=/app/app/worker
autostart=true
autorestart=true
user=node
environment=NODE_ENV=production
stdout_logfile=/var/log/worker/stdout.log
stderr_logfile=/var/log/worker/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB